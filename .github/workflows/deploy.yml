name: Build and Deploy Angular to S3

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Angular app (Production)
        run: npx ng build --configuration production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          #aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-access-key-id: AKIAXF33W4ZYDP47QKUD
          #aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-secret-access-key: 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
          aws-region: ap-south-2
          #aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync dist/leave-management-app/browser/ s3://lms-fe-bucket/ --delete
          #aws s3 sync dist/your-angular-project-name s3://${{ secrets.S3_BUCKET }} --delete
