<h2>Leave Types</h2>

<button (click)="toggleForm()">Add Leave Type</button>

<div *ngIf="showForm" style="border:1px solid #aaa; padding:10px; margin-top:10px">

  <h3>{{ isEdit ? 'Edit Leave Type' : 'Add Leave Type' }}</h3>

  <label>Leave Code</label><br>
  <input [(ngModel)]="form.leaveCode"><br>

  <label>Leave Name</label><br>
  <input [(ngModel)]="form.leaveName"><br>

  <label>Annual Allocation</label><br>
  <input type="number" [(ngModel)]="form.annualAllocation"><br>

  <label>
    <input type="checkbox" [(ngModel)]="form.carryForward">
    Carry Forward
  </label>
  <br><br>

  <button (click)="save()">
    {{ isEdit ? 'Update' : 'Save' }}
  </button>

  <button (click)="showForm=false">Cancel</button>
</div>

<hr>

<table border="1" cellpadding="8" *ngIf="leaveTypes.length > 0">
  <tr>
    <th>#</th>
    <th>Code</th>
    <th>Name</th>
    <th>Allocation</th>
    <th>Carry Forward</th>
    <th>Actions</th>
  </tr>

  <tr *ngFor="let lt of leaveTypes; let i = index">
    <td>{{ i + 1 }}</td>
    <td>{{ lt.leaveCode }}</td>
    <td>{{ lt.leaveName }}</td>
    <td>{{ lt.annualAllocation }}</td>
    <td>{{ lt.carryForward ? 'Yes' : 'No' }}</td>
    <td>
      <button (click)="toggleForm(true, lt)">Edit</button>
      <button (click)="delete(lt.leaveTypeId)">Delete</button>
    </td>
  </tr>
</table>

<p *ngIf="leaveTypes.length === 0">No records found</p>
