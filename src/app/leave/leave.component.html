<h2>Leave Requests</h2>

<button class="btn-primary" (click)="toggleForm()">Apply Leave</button>

<div *ngIf="showForm" class="form-card">

  <h3>Apply Leave</h3>
  <div class="form-row">
  <label>Employee ID <span class="required">*</span> :</label>
  <input  class="inline-input" [(ngModel)]="form.employeeId">
  </div>
  <div class="form-row">
  <label>Leave Type <span class="required">*</span> :</label>
  <select class="inline-input" [(ngModel)]="form.leaveTypeId" name="leaveTypeId" required>
    <option value="">-- Select Leave Type --</option>
    <option *ngFor="let lt of leaveTypes" [value]="lt.leaveTypeId">
      {{ lt.leaveName }}
    </option>
  </select>
</div>
<div class="form-row">
  <label>Start Date <span class="required">*</span> :</label><br>
  <input class="inline-input" type="date" [(ngModel)]="form.startDate"><br>
</div>
<div class="form-row">
  <label>End Date <span class="required">*</span> :</label><br>
  <input class="inline-input" type="date" [(ngModel)]="form.endDate"><br>
</div>
<div class="form-row">
  <label>Reason <span class="required">*</span> :</label><br>
  <input class="inline-input" [(ngModel)]="form.reason"><br><br>
</div>
  <button class="btn-primary" (click)="applyLeave()">Submit</button>
  <button class="btn-secondary" (click)="cancel()">Cancel</button>
</div>

<hr>
<div class="table-wrapper" *ngIf="currentUserIsAdmin">
<table class="styled-table" *ngIf="leaveRequests.length>0">
  <thead>
  <tr>
    <th>S.No</th>
    <th>Employee_Name</th>
    <th>Leave_Type</th>
    <th>From</th>
    <th>To</th>
    <th>Reason</th>
    <th>Status</th>
    <th>Action</th>
  </tr>
</thead>
<tbody>
  <tr *ngFor="let l of leaveRequests; let i = index">
    <td>{{i+1}}</td>
    <td>{{ l?.employee?.firstName }} {{ l?.employee?.lastName }}</td>
    <td>{{ l?.leaveType?.leaveName }}</td>
    <td>{{ l.startDate }}</td>
    <td>{{ l.endDate }}</td>
    <td>{{ l.reason }}</td>
    <td>{{ l.status }}</td>
    <td>
        <input type="text" [(ngModel)]="approverIds[i]" [disabled]="l.status !== 'PENDING'">
        <button class="approve-btn" (click)="approve(l, approverIds[i])" [disabled]="l.status !== 'PENDING'">Approve</button>
        <button class="reject-btn" (click)="reject(l,approverIds[i])"  [disabled]="l.status !== 'PENDING'">Reject</button>
    </td>
  </tbody>
</table>
</div>
<p *ngIf="leaveRequests.length===0">
  No leave records
</p>
