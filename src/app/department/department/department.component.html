<h2>Department List</h2>

<button class="btn-primary"  (click)="toggleForm()">Add Department</button>

<div *ngIf="showAddForm" class="form-card">
  <label>Department Name *</label>
  <input class="form-input" [(ngModel)]="deptName" placeholder="Department Name">
  <button  class="btn-primary" (click)="saveDepartment()">Save</button>
  <button class="btn-secondary" (click)="toggleForm()">Cancel</button>
</div>

<div class="table-wrapper" *ngIf="departments.length > 0">
  <table class="styled-table">
    
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let d of departments">
        <td>{{d.deptId}}</td>
        <td>{{d.deptName}}</td>
      </tr>
    </tbody>

  </table>
</div>

<p *ngIf="departments.length == 0" style="text-align:center">
  No data found
</p>
